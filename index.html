<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TalkCal</title>
<style>
:root{--bg:#f7f7fb;--card:#fff;--ink:#252532;--muted:#8a8d98;--line:#e9e9f0;--p:#7468f6;--soft:#efefff}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#efedff 0,#f8f8fc 30%,#f7f7fb 100%);font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink)}
.app{max-width:480px;margin:auto;min-height:100vh;padding:18px 14px 110px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.logo{font-size:28px;font-weight:900}.logo i{font-style:normal;color:var(--p)}.avatar{width:44px;height:44px;border-radius:15px;background:#fff;display:grid;place-items:center;border:1px solid var(--line);font-size:21px}
.card{background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:24px;padding:17px;margin-bottom:13px;box-shadow:0 12px 28px rgba(65,55,130,.055)}
.hero{background:linear-gradient(135deg,#7468f6,#a8a1ff);color:#fff;border:0}.hero small{opacity:.86}.hero h1{font-size:29px;margin:5px 0}.hero p{margin:0;opacity:.93;line-height:1.5}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.head span{font-size:12px;color:var(--muted)}.screen{display:none}.screen.active{display:block}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}.tab{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 6px;font-weight:800;color:#666}.tab.active{background:var(--soft);border:2px solid var(--p);color:var(--p)}
.repeatKinds{display:none;gap:6px;flex-wrap:wrap;margin:4px 0 12px}.repeatKinds.show{display:flex}
.weekdayPick{display:none;gap:6px;flex-wrap:wrap;margin:0 0 12px}.weekdayPick.show{display:flex}
.weekdayPick button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:800}
.weekdayPick button.on{background:var(--p);color:#fff;border-color:var(--p)}
.bulkCal{display:none;margin-top:13px}.bulkCal.show{display:block}
.bulkDay{min-height:45px;border:1px solid var(--line);border-radius:11px;background:#fff;font-weight:700}
.bulkDay.on{background:var(--p);color:#fff;border-color:var(--p)}
.bulkDay.blank{visibility:hidden}.bulkTools{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
.repeatKind{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-weight:800;color:#666}.repeatKind.active{background:var(--soft);color:var(--p);border-color:var(--p)}
.inputwrap{display:flex;gap:8px;border:1px solid var(--line);border-radius:18px;padding:7px;background:#fff}.inputwrap input{flex:1;border:0;outline:0;min-width:0;font-size:17px;padding:11px}.addbtn{border:0;background:var(--p);color:#fff;border-radius:14px;padding:0 15px;font-weight:900}.example{margin-top:10px;font-size:13px;color:var(--muted);line-height:1.6}
.details{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.details summary{cursor:pointer;font-weight:800;color:#666}label{display:block;font-size:12px;font-weight:800;color:#666;margin:11px 0 6px}.field{width:100%;border:1px solid var(--line);background:#fafafd;border-radius:13px;padding:12px;font-size:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.notice{display:none;margin-top:12px;padding:12px;border-radius:14px;background:#f3f2ff;font-size:13px;line-height:1.5}.notice.show{display:block}
.event{display:grid;grid-template-columns:58px 5px 1fr auto;gap:9px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.event:last-child{border:0}.time{font-weight:900}.bar{height:40px;background:var(--p);border-radius:9px}.title{font-weight:800}.meta{font-size:12px;color:var(--muted);margin-top:2px}.tiny{border:0;background:#f4f4f8;border-radius:10px;padding:7px;color:#777}.empty{text-align:center;color:var(--muted);padding:17px}
.chat{display:flex;flex-direction:column;gap:9px;max-height:50vh;overflow:auto}.msg{max-width:88%;border-radius:18px;padding:11px 13px;line-height:1.5;font-size:14px;white-space:pre-line}.ai{align-self:flex-start;background:#efeff7}.me{align-self:flex-end;background:var(--p);color:#fff}.composer{display:flex;gap:8px;margin-top:12px;border:1px solid var(--line);border-radius:17px;padding:6px;background:#fff}.composer input{border:0;outline:0;flex:1;min-width:0;padding:10px;font-size:16px}.send{border:0;background:var(--p);color:#fff;width:44px;border-radius:13px;font-weight:900}.chips{display:flex;gap:6px;overflow:auto;padding:9px 0}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:12px}
.nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(452px,calc(100% - 20px));display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:7px;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:22px;box-shadow:0 15px 35px rgba(55,50,100,.14);z-index:1000;pointer-events:auto}.nav button{border:0;background:transparent;border-radius:15px;padding:8px 2px;color:#8b8d99;font-size:11px;font-weight:800;min-width:0;pointer-events:auto;touch-action:manipulation}.nav button b{font-size:20px;display:block}.nav button.active{background:var(--soft);color:var(--p)}
.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week div{text-align:center;font-size:11px;color:var(--muted)}.day{min-height:55px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}.dot{width:6px;height:6px;background:var(--p);border-radius:50%;margin:4px auto}.today{background:var(--soft)}.daydetail{display:none}.daydetail.show{display:block}.daytitle{font-size:22px;font-weight:900;margin-bottom:4px}.subtle{font-size:12px;color:var(--muted)}

.conflictBox{display:none;margin-top:14px;border:1px solid #f1cf74;background:#fffaf0;border-radius:18px;padding:14px}.conflictBox.show{display:block}.conflictTitle{font-weight:900;font-size:16px;margin-bottom:7px}.conflictItem{background:#fff;border:1px solid #f0e5c9;border-radius:13px;padding:10px;margin:8px 0;font-size:13px;line-height:1.55}.conflictBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.conflictBtns button{border:0;border-radius:12px;padding:11px 8px;font-weight:900}.forceBtn{background:#fff0c7;color:#7a5600}.moveBtn{background:var(--p);color:#fff}.cancelBtn{grid-column:1/-1;background:#f1f1f5;color:#666}.suggestions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.suggestions button{border:1px solid #dcd8ff;background:#fff;color:var(--p);border-radius:999px;padding:8px 10px;font-weight:800}
.answerCard{align-self:stretch;background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:0 7px 18px rgba(70,60,130,.05)}.answerHead{font-weight:900;margin:2px 4px 8px}.dayGroup{display:grid;grid-template-columns:66px 1fr;gap:8px;padding:9px 5px;border-top:1px solid var(--line)}.dayGroup:first-of-type{border-top:0}.dayLabel{font-weight:900}.dayLabel small{display:block;color:var(--muted);font-size:11px}.dayItems{display:flex;flex-direction:column;gap:4px}.dayEvent{display:grid;grid-template-columns:82px 1fr;gap:7px;font-size:13px}.dayEvent b{font-weight:800}.freeCard{align-self:stretch;background:#eefaf3;border:1px solid #d8f1e1;border-radius:18px;padding:13px}.freeCard b{color:#238553}.chat{max-height:58vh}.msg.aiIntro{background:#efeff7}

</style>
<style>.day.selected{background:var(--p)!important;color:#fff!important;box-shadow:0 6px 14px rgba(105,84,220,.22)}.day.selected .dot{background:#fff!important}</style>
<style>
/* v15: clear primary action */
.addAction{
  margin-top:18px;
  padding-top:16px;
  border-top:1px solid var(--line);
}
.primaryAddBtn{
  width:100%;
  min-height:58px;
  border:0;
  border-radius:18px;
  background:linear-gradient(135deg,#6954dc,#8b7cff);
  color:#fff;
  font-size:17px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  box-shadow:0 12px 26px rgba(105,84,220,.28);
  cursor:pointer;
  touch-action:manipulation;
}
.primaryAddBtn:active{transform:scale(.985);box-shadow:0 7px 16px rgba(105,84,220,.22)}
.primaryAddIcon{
  width:26px;height:26px;border-radius:50%;
  background:rgba(255,255,255,.2);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:21px;line-height:1;
}
.addActionHint{
  text-align:center;
  margin-top:8px;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}
</style>
<style>
.singleCal{margin-top:14px;padding:14px;border:1px solid #ddd8f6;border-radius:18px;background:#faf9ff}
.miniCalTitle{display:flex;align-items:center;gap:7px;margin-bottom:10px;font-size:14px;color:#5748bd}
.singleDay{min-height:45px;border:1px solid var(--line);border-radius:11px;background:#fff;font-weight:800;color:#444}
.singleDay.blank{visibility:hidden}
.singleDay.on{background:var(--p);color:#fff;border-color:var(--p);box-shadow:0 6px 14px rgba(105,84,220,.2)}
.selectedDateNote{text-align:center;margin-top:10px;font-size:12px;font-weight:800;color:var(--muted)}
</style><style>
.directDate{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.directDate summary{cursor:pointer;font-size:13px;font-weight:800;color:var(--muted)}
</style></head>
<body>
<main class="app">
<section id="home" class="screen active">
  <div class="top"><div class="logo">Talk<i>Cal</i></div><div class="avatar">👧🏻</div></div>
  <div class="card hero"><small id="date"></small><h1>今日どうする？</h1><p id="summary">予定を確認してるよ。</p></div>
  <div class="card"><div class="head"><b>今日の予定</b><span id="todayN"></span></div><div id="todayList"></div></div>
  <div class="card"><div class="head"><b>締切</b><span id="taskN"></span></div><div id="tasks"></div></div>
</section>

<section id="add" class="screen">
  <div class="top"><div class="logo">予定を追加</div><div class="avatar">＋</div></div>
  <div class="card">
    <div class="head"><b>種類を選ぶ</b><span>1行で追加</span></div>
    <div class="tabs">
      <button class="tab active" data-type="single">単日</button>
      <button class="tab" data-type="repeat">繰り返し</button>
      <button class="tab" data-type="bulk">一括</button>
      <button class="tab" data-type="deadline">締切</button>
    </div>
    <div id="repeatKinds" class="repeatKinds">
      <button class="repeatKind active" data-repeat="daily">毎日</button>
      <button class="repeatKind" data-repeat="weekday">平日</button>
      <button class="repeatKind" data-repeat="weekendholiday">土日祝</button>
      <button class="repeatKind" data-repeat="weekly">毎週</button>
    </div>
    <div id="weekdayPick" class="weekdayPick">
      <button type="button" data-rw="1">月</button><button type="button" data-rw="2">火</button>
      <button type="button" data-rw="3">水</button><button type="button" data-rw="4">木</button>
      <button type="button" data-rw="5">金</button><button type="button" data-rw="6">土</button>
      <button type="button" data-rw="0">日</button>
    </div>
    <div id="dateFieldWrap">
      <div id="singleCal" class="singleCal">
        <div class="miniCalTitle"><span>📅</span><b id="miniCalTitleText">カレンダーから日付を選ぶ</b></div>
        <div class="bulkTools"><button class="tiny" id="singlePrev" type="button">←</button><b id="singleMonth"></b><button class="tiny" id="singleNext" type="button">→</button></div>
        <div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div>
        <div class="grid" id="singleGrid"></div>
        <div class="selectedDateNote" id="selectedDateNote">日付をタップして選択</div>
      </div>
      <details class="directDate">
        <summary>遠い日付は直接入力</summary>
        <label id="dateLabel">日付</label>
        <input class="field" id="dateInput" inputmode="numeric" autocomplete="off" placeholder="例：9/20 または 2027/1/10">
      </details>
    </div>
    <div class="row">
      <div id="startFieldWrap"><label>時間</label><input class="field" id="startInput" type="text" inputmode="numeric" autocomplete="off" placeholder="例：15:00" maxlength="5"></div>
      <div><label>内容</label><input class="field" id="titleInput" autocomplete="off" placeholder="例：病院"></div>
    </div>
    <div class="example" id="example"></div>
    <div class="notice" id="notice"></div>
    <div id="bulkCal" class="bulkCal">
      <div class="bulkTools"><button class="tiny" id="bulkPrev">←</button><b id="bulkMonth"></b><button class="tiny" id="bulkNext">→</button></div>
      <div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div>
      <div class="grid" id="bulkGrid"></div>
      <div class="subtle" id="bulkCount" style="margin-top:9px">0日選択中</div>
    </div>
    <div id="conflictBox" class="conflictBox">
      <div class="conflictTitle" id="conflictTitle">⚠️ 近い予定があります</div>
      <div id="conflictList"></div>
      <div id="moveArea"></div>
      <div class="conflictBtns">
        <button id="forceAdd" class="forceBtn">そのまま追加</button>
        <button id="movePlan" class="moveBtn">時間を動かす</button>
        <button id="cancelPending" class="cancelBtn">やめる</button>
      </div>
    </div>
    <details class="details">
      <summary>詳細設定</summary>
      <div class="row">
        <div><label>終了時間</label><input class="field" type="text" id="endOverride" inputmode="numeric" autocomplete="off" placeholder="例：09:00" maxlength="5"></div>
        <div><label>終了日</label>
          <select class="field" id="endDayOffset">
            <option value="0">未設定（当日）</option>
            <option value="1">翌日</option>
            <option value="2">2日後</option>
            <option value="3">3日後</option>
          </select>
        </div>
      </div>
      <label>メモ</label><input class="field" id="memo" placeholder="任意">
      <div class="subtle" style="margin-top:8px">終了日の指定がなければ当日として扱うよ。夜勤や泊まりは「翌日」を選択。</div>
    </details>

    <div class="addAction">
      <button class="primaryAddBtn" id="quickAdd" type="button">
        <span class="primaryAddIcon">＋</span>
        <span id="quickAddLabel">この予定を追加する</span>
      </button>
      <div class="addActionHint" id="addActionHint">入力した内容をカレンダーに反映します</div>
    </div>
  </div>
</section>

<section id="chat" class="screen">
  <div class="top"><div class="logo">あいちゃん</div><div class="avatar">👧🏻</div></div>
  <div class="card">
    <div class="head"><b>予定を聞く</b><span>AI APIなし</span></div>
    <div class="chat" id="messages"><div class="msg ai aiIntro">予定の確認なら聞いてね。「9月20日の予定は？」「10/3空いてる？」みたいな日付指定にも対応したよ！</div></div>
    <div class="chips">
      <button class="chip">今日の予定は？</button><button class="chip">明日の予定は？</button>
      <button class="chip">先週の予定は？</button><button class="chip">来週の予定は？</button><button class="chip">今週忙しい？</button>
    </div>
    <form class="composer" id="chatForm"><input id="q" placeholder="例：9月20日の予定は？"><button class="send">↑</button></form>
  </div>
</section>

<section id="cal" class="screen">
  <div class="top"><div class="logo">カレンダー</div><div class="avatar">📅</div></div>
  <div class="card">
    <div class="head"><button class="tiny" id="prev">←</button><b id="month"></b><button class="tiny" id="next">→</button></div>
    <div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="card daydetail" id="dayDetail">
    <div class="daytitle" id="dayTitle"></div>
    <div class="subtle" id="daySub"></div>
    <div id="dayEvents" style="margin-top:8px"></div>
    <button class="addbtn" id="addForDay" style="width:100%;height:46px;margin-top:10px">この日に予定を追加</button>
  </div>
</section>
</main>

<nav class="nav">
  <button type="button" class="active" data-tab="home"><b>⌂</b>ホーム</button>
  <button type="button" data-tab="add"><b>＋</b>追加</button>
  <button type="button" data-tab="chat"><b>💬</b>聞く</button>
  <button type="button" data-tab="cal"><b>▦</b>カレンダー</button>
</nav>

<script>
const pad=n=>String(n).padStart(2,'0'), now=new Date(), todayKey=K(now);
function K(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
const fmt=k=>{let [y,m,d]=k.split('-');return `${+m}月${+d}日`};
const mins=t=>{let[a,b]=t.split(':').map(Number);return a*60+b};
const W={'日':0,'月':1,'火':2,'水':3,'木':4,'金':5,'土':6};
let ev=JSON.parse(localStorage.getItem('tc_hybrid_v2_ev')||'[]');
let tasks=JSON.parse(localStorage.getItem('tc_hybrid_v2_tasks')||'[]');
let type='single', repeatKind='daily', cy=now.getFullYear(), cm=now.getMonth(), selectedDay=null;
let singleY=now.getFullYear(), singleM=now.getMonth();
let bulkY=now.getFullYear(), bulkM=now.getMonth(), bulkDates=new Set(), weeklyDays=new Set();
let pendingRisk=[];
const save=()=>{localStorage.setItem('tc_hybrid_v2_ev',JSON.stringify(ev));localStorage.setItem('tc_hybrid_v2_tasks',JSON.stringify(tasks))};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function overlap(a,b){
  let [as,ae]=eventRange(a),[bs,be]=eventRange(b);
  return as<be&&bs<ae
}
function dateAt(k,t){let [y,m,d]=k.split('-').map(Number),[h,mi]=t.split(':').map(Number);return new Date(y,m-1,d,h,mi,0,0).getTime()}
function eventRange(e){let st=dateAt(e.date,e.start),off=Number(e.endDayOffset||0),ed=K(addDays(new Date(e.date+'T00:00:00'),off));return [st,dateAt(ed,e.end)]}
function endLabel(e){let off=Number(e.endDayOffset||0);return off?`${off===1?'翌日':off+'日後'} ${e.end}`:e.end}
function eventTouchesDay(e,k){
  let ds=dateAt(k,'00:00'),de=dateAt(K(addDays(new Date(k+'T00:00:00'),1)),'00:00');
  let [es,ee]=eventRange(e);return es<de&&ee>ds
}
function displayTimeForDay(e,k){
  if(e.date===k)return `${e.start}〜${endLabel(e)}`;
  let off=Math.round((new Date(k+'T00:00:00')-new Date(e.date+'T00:00:00'))/86400000);
  let final=Number(e.endDayOffset||0)===off;
  return final?`前日から〜${e.end}`:'前日から継続';
}
function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}
function nextWeekday(day){let d=new Date();let diff=(day-d.getDay()+7)%7;if(diff===0)diff=7;return addDays(d,diff)}
function parseDateToken(tok){
  tok=tok.trim();
  if(tok==='今日') return K(new Date());
  if(tok==='明日') return K(addDays(new Date(),1));
  if(tok==='明後日') return K(addDays(new Date(),2));
  let ymd=tok.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
  if(ymd){
    let d=new Date(+ymd[1],+ymd[2]-1,+ymd[3]);
    if(d.getFullYear()===+ymd[1]&&d.getMonth()===+ymd[2]-1&&d.getDate()===+ymd[3])return K(d);
    return null;
  }
  let md=tok.match(/^(\d{1,2})[\/\-](\d{1,2})$/);
  if(md){
    let d=new Date(now.getFullYear(),+md[1]-1,+md[2]);
    if(d.getMonth()===+md[1]-1&&d.getDate()===+md[2])return K(d);
    return null;
  }
  let jp=tok.match(/^(\d{1,2})月(\d{1,2})日$/); if(jp)return `${now.getFullYear()}-${pad(+jp[1])}-${pad(+jp[2])}`;
  let day=tok.match(/^(\d{1,2})日$/); if(day)return `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(+day[1])}`;
  return null;
}
function parseTime(tok){let m=tok.match(/^(\d{1,2})(?::(\d{1,2}))?$/);if(!m)return null;let h=+m[1],mm=+(m[2]||0);if(h>23||mm>59)return null;return `${pad(h)}:${pad(mm)}`}
function normalizeTypedTime(v){
  let x=(v||'').trim().replace(/：/g,':');
  if(/^\d{3,4}$/.test(x)){
    x=x.padStart(4,'0');
    x=x.slice(0,2)+':'+x.slice(2);
  }
  let m=x.match(/^(\d{1,2}):(\d{1,2})$/);
  if(!m)return null;
  let h=Number(m[1]),mi=Number(m[2]);
  if(h>23||mi>59)return null;
  return `${pad(h)}:${pad(mi)}`;
}
function defaultEnd(start){let m=mins(start)+60,h=Math.floor(m/60)%24,mm=m%60;return `${pad(h)}:${pad(mm)}`}
function nthMonday(year,month,n){let d=new Date(year,month-1,1),add=(1-d.getDay()+7)%7+(n-1)*7;d.setDate(1+add);return K(d)}
function japanHolidays(year){
  let s=new Set([
    `${year}-01-01`,`${year}-02-11`,`${year}-02-23`,`${year}-04-29`,`${year}-05-03`,`${year}-05-04`,`${year}-05-05`,
    `${year}-08-11`,`${year}-11-03`,`${year}-11-23`
  ]);
  [nthMonday(year,1,2),nthMonday(year,7,3),nthMonday(year,9,3),nthMonday(year,10,2)].forEach(x=>s.add(x));
  let vernal=Math.floor(20.8431+0.242194*(year-1980)-Math.floor((year-1980)/4));
  let autumn=Math.floor(23.2488+0.242194*(year-1980)-Math.floor((year-1980)/4));
  s.add(`${year}-03-${pad(vernal)}`); s.add(`${year}-09-${pad(autumn)}`);
  let base=[...s].sort(); base.forEach(k=>{let d=new Date(k+'T00:00:00');if(d.getDay()===0){let x=addDays(d,1);while(s.has(K(x)))x=addDays(x,1);s.add(K(x))}});
  return s;
}
function isHoliday(d){return japanHolidays(d.getFullYear()).has(K(d))}
function matchesRepeat(d,kind,weeklyDays=[]){
  if(kind==='daily')return true;
  if(kind==='weekday')return d.getDay()>=1&&d.getDay()<=5&&!isHoliday(d);
  if(kind==='weekendholiday')return d.getDay()===0||d.getDay()===6||isHoliday(d);
  if(kind==='weekly')return weeklyDays.includes(d.getDay());
  return false;
}

function parseQuick(){
  let title=document.getElementById('titleInput').value.trim();
  if(type==='deadline'){
    let d=parseDateField(document.getElementById('dateInput').value);
    if(!d)return {error:'締切日を 9/25 のように入れてね'};
    if(!title)return {error:'内容を入れてね'};
    return {kind:'deadline',deadline:d,title}
  }
  let start=normalizeTypedTime(document.getElementById('startInput').value);
  if(!start)return {error:'時間を 15:00 のように入れてね'};
  if(!title)return {error:'内容を入れてね'};
  if(type==='single'){
    let d=parseDateField(document.getElementById('dateInput').value);
    if(!d)return {error:'日付を 9/20 のように入れてね'};
    return {kind:'events',dates:[d],start,title,rule:'single'}
  }
  if(type==='repeat'){
    let days=[...weeklyDays];
    if(repeatKind==='weekly'&&!days.length)return {error:'曜日を選んでね'};
    let dates=[],cur=addDays(new Date(),1),stop=addDays(new Date(),56);
    for(;cur<=stop;cur=addDays(cur,1))if(matchesRepeat(cur,repeatKind,days))dates.push(K(cur));
    return {kind:'events',dates,start,title,rule:repeatKind}
  }
  if(type==='bulk'){
    if(!bulkDates.size)return {error:'カレンダーから日付を選んでね'};
    return {kind:'events',dates:[...bulkDates].sort(),start,title,rule:'bulk'}
  }
}
function riskFor(x){
  let [xs,xe]=eventRange(x);
  return ev.map(y=>{
    let [ys,ye]=eventRange(y);

    // If both schedules have an explicitly entered end time, use the full
    // start-to-end ranges. This catches cases such as an existing
    // 10:00〜12:00 event and a new 11:30 event.
    let exact=(x.endExplicit&&y.endExplicit&&xs<ye&&ys<xe);

    // When only one side has a known end time, also protect that known range:
    // if the unknown-duration event STARTS inside it, warn instead of silently adding.
    let insideKnown=
      (!x.endExplicit&&y.endExplicit&&xs>=ys&&xs<ye) ||
      (x.endExplicit&&!y.endExplicit&&ys>=xs&&ys<xe);

    // Fallback for schedules without enough duration information.
    let near=Math.abs(xs-ys)<=60*60*1000;

    return exact?{event:y,kind:'overlap'}:
           insideKnown?{event:y,kind:'inside'}:
           near?{event:y,kind:'near'}:null;
  }).filter(Boolean)
}
function renderConflict(){
  let box=document.getElementById('conflictBox');
  if(!pendingRisk.length){box.classList.remove('show');document.getElementById('moveArea').innerHTML='';return}
  box.classList.add('show');
  let hasOverlap=pendingRisk.some(p=>p.hits.some(h=>h.kind==='overlap'||h.kind==='inside'));
  document.getElementById('conflictTitle').textContent=hasOverlap?'🔴 予定が重なっています':'🟡 近い予定があります';
  document.getElementById('conflictList').innerHTML=pendingRisk.map(p=>`<div class="conflictItem"><b>${fmt(p.x.date)} ${p.x.start}　${esc(p.x.title)}</b><br>${p.hits.map(h=>`${h.kind==='overlap'?'重複':h.kind==='inside'?'予定時間内':'前後1時間以内'}：${h.event.start}〜${endLabel(h.event)} ${esc(h.event.title)}`).join('<br>')}</div>`).join('');
}
function clearAddInput(){document.getElementById('dateInput').value='';document.getElementById('startInput').value='';document.getElementById('titleInput').value='';document.getElementById('endOverride').value='';document.getElementById('endDayOffset').value='0';document.getElementById('memo').value='';if(type==='bulk'){bulkDates.clear();renderBulk()}}
function quickAdd(){
  let p=parseQuick();if(p.error){notice(p.error);return}
  if(p.kind==='deadline'){tasks.push({id:String(Date.now()),title:p.title,deadline:p.deadline,done:false});save();render();clearAddInput();notice('締切を追加したよ');return}
  let rawEnd=document.getElementById('endOverride').value.trim();
  let explicitEnd=rawEnd?normalizeTypedTime(rawEnd):'';
  if(rawEnd&&!explicitEnd){notice('終了時間は 09:00 のように入力してね');return}
  if(explicitEnd)document.getElementById('endOverride').value=explicitEnd;
  let endDayOffset=Number(document.getElementById('endDayOffset').value||0);
  let end=explicitEnd||defaultEnd(p.start);
  if(explicitEnd&&endDayOffset===0&&mins(end)<=mins(p.start)){notice('当日終了なら、終了時間は開始より後にしてね。夜勤や泊まりは終了日を「翌日」にしてね');return}
  if(!explicitEnd&&endDayOffset>0){notice('翌日以降を選ぶときは終了時間も入れてね');return}
  let memo=document.getElementById('memo').value.trim(),safe=[];pendingRisk=[];
  p.dates.forEach(date=>{let x={id:String(Date.now()+Math.random()),date,start:p.start,end,title:p.title,memo,recurrence:p.rule,endExplicit:!!explicitEnd,endDayOffset:explicitEnd?endDayOffset:0};let hits=riskFor(x);hits.length?pendingRisk.push({x,hits}):safe.push(x)});
  safe.forEach(x=>ev.push(x));save();render();
  if(pendingRisk.length){renderConflict();notice(safe.length?`${safe.length}件は追加したよ。近い予定だけ確認してね`:'追加前に確認してね')}
  else{clearAddInput();renderConflict();notice(`${safe.length}件追加したよ`)}
}
function findSuggestions(p){
  let dur=Math.max(30,(eventRange(p.x)[1]-eventRange(p.x)[0])/60000),base=mins(p.x.start),out=[];if(dur>720)return out;
  for(let step=1;step<=12&&out.length<4;step++)for(let sign of [1,-1]){
    let m=base+sign*step*30;if(m<0||m+dur>1440)continue;
    let st=`${pad(Math.floor(m/60))}:${pad(m%60)}`,en=`${pad(Math.floor((m+dur)/60))}:${pad((m+dur)%60)}`;
    let cand={...p.x,start:st,end:en,endDayOffset:0};if(!riskFor(cand).length&&!out.some(x=>x.start===st))out.push(cand)
  }
  return out.sort((a,b)=>mins(a.start)-mins(b.start))
}
function showMove(){
  if(!pendingRisk.length)return;let p=pendingRisk[0],sug=findSuggestions(p),a=document.getElementById('moveArea');
  a.innerHTML=`<div class="conflictItem"><b>${fmt(p.x.date)} の空いていそうな時間</b><div class="suggestions">${sug.length?sug.map((x,i)=>`<button data-sug="${i}">${x.start}〜${x.end}</button>`).join(''):'候補が見つからなかったよ'}</div></div>`;
  a.querySelectorAll('[data-sug]').forEach(b=>b.onclick=()=>{let cand=sug[+b.dataset.sug];ev.push(cand);pendingRisk.shift();save();render();renderConflict();if(!pendingRisk.length){clearAddInput();notice('時間を動かして追加したよ')}else{showMove()}})
}

function range(kind){let d=new Date();if(kind==='tomorrow')d.setDate(d.getDate()+1);if(kind==='today'||kind==='tomorrow')return[K(d),K(d)];let day=d.getDay(),delta=(day===0?-6:1-day);let shift=kind==='nextweek'?7:kind==='lastweek'?-7:0;d.setDate(d.getDate()+delta+shift);let a=K(d);d.setDate(d.getDate()+6);return[a,K(d)]}
function extractAskedDate(q){
  let m=q.match(/(\d{1,2})月(\d{1,2})日/);if(m)return `${now.getFullYear()}-${pad(+m[1])}-${pad(+m[2])}`;
  m=q.match(/(\d{1,2})[\/\-](\d{1,2})/);if(m)return `${now.getFullYear()}-${pad(+m[1])}-${pad(+m[2])}`;
  m=q.match(/(?:^|[^\d])(\d{1,2})日/);if(m)return `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(+m[1])}`;
  return null;
}
function answerData(q){
  let specific=extractAskedDate(q),r;
  if(specific)r=[specific,specific];else if(/明日/.test(q))r=range('tomorrow');else if(/先週/.test(q))r=range('lastweek');else if(/来週/.test(q))r=range('nextweek');else if(/今週/.test(q))r=range('week');else r=range('today');
  let a=ev.filter(e=>{
    let d=new Date(r[0]+'T00:00:00');
    while(K(d)<=r[1]){if(eventTouchesDay(e,K(d)))return true;d=addDays(d,1)}
    return false
  }).sort((a,b)=>eventRange(a)[0]-eventRange(b)[0]);
  if(/忙し/.test(q))return {type:'text',text:a.length>=8?`今週は${a.length}件。ちょっと忙しめだよ。`:a.length>=4?`今週は${a.length}件。ほどよく予定が入ってるよ。`:`今週は${a.length}件。比較的ゆったりしてるよ。`};

}

function openDay(k){
  selectedDay=k;calendar();let a=ev.filter(e=>eventTouchesDay(e,k)),t=tasks.filter(x=>!x.done&&x.deadline===k);
  document.getElementById('dayDetail').classList.add('show');document.getElementById('dayTitle').textContent=fmt(k);
  document.getElementById('daySub').textContent=`予定 ${a.length}件${t.length?`・締切 ${t.length}件`:''}`;
  list(a,'dayEvents',true,k);
  if(t.length)document.getElementById('dayEvents').insertAdjacentHTML('beforeend',t.map(x=>`<div class="event"><div class="time">締切</div><div class="bar"></div><div><div class="title">${esc(x.title)}</div><div class="meta">この日までに</div></div><span></span></div>`).join(''));
  document.getElementById('dayDetail').scrollIntoView({behavior:'smooth',block:'nearest'})
}
function calendar(){
  document.getElementById('month').textContent=`${cy}年 ${cm+1}月`;let g=document.getElementById('grid');g.innerHTML='';let f=new Date(cy,cm,1).getDay(),last=new Date(cy,cm+1,0).getDate();
  for(let i=0;i<f;i++)g.appendChild(document.createElement('div'));
  for(let d=1;d<=last;d++){let k=`${cy}-${pad(cm+1)}-${pad(d)}`,b=document.createElement('button');b.className='day'+(k===todayKey?' today':'')+(k===selectedDay?' selected':'');b.innerHTML=`${d}${ev.some(e=>eventTouchesDay(e,k))||tasks.some(t=>!t.done&&t.deadline===k)?'<div class="dot"></div>':''}`;b.onclick=()=>openDay(k);g.appendChild(b)}
}
document.getElementById('addForDay').onclick=()=>{if(!selectedDay)return;type='single';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.type==='single'));examples();show('add');document.getElementById('dateInput').value=`${+selectedDay.slice(5,7)}/${+selectedDay.slice(8,10)}`;document.getElementById('startInput').focus()};
document.getElementById('prev').onclick=()=>{if(--cm<0){cm=11;cy--}calendar();document.getElementById('dayDetail').classList.remove('show')};
document.getElementById('next').onclick=()=>{if(++cm>11){cm=0;cy++}calendar();document.getElementById('dayDetail').classList.remove('show')};
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===id))}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));
function render(){home();calendar()}
examples();renderSingleCal();render();
</script>
</body>
